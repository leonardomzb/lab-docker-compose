
services:
  # BASE DE DATOS
  base_datos:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} --dbname=${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 5
    networks:
      - backend-net
    #restart: always
    restart: unless-stopped

  # 2. BACKEND
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: base_datos
      DB_USER: ${POSTGRES_USER}
      DB_NAME: ${POSTGRES_DB}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - frontend
      - base_datos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - frontend-net
      - backend-net
    #restart: always
    restart: unless-stopped

  # 3. FRONTEND
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    networks:
      - frontend-net
    #restart: always
    restart: unless-stopped  

  # PROXY INVERSO
  proxy:
    image: nginx:1.26-alpine
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - frontend-net
    #restart: always
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge